<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profiles</title>
    <style>
        .user-card {
            border: 1px solid #ccc;
            padding:16px;
            margin:12px;
            border-radius:8px;
            max-width:550px;
        }
    </style>
</head>
<body>
    <h1>User Profile List</h1>
    <div id="container"></div>

    <script>
        const container = document.getElementById('container');

        fetch('userProfiles.json')
        .then(response => {
            if (!response.ok)
                throw new Error('Fetch error: ' + response.status)
            else
                return response.json();
        })
        .then(json => {
            json.forEach(user =>{
                const card = document.createElement('div');
                card.className = "user-card";

                card.innerHTML = `
                    <h3>${user.firstName} ${user.lastName}</h3>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Date of Birth:</strong> ${user.dateOfBirth}</p>
                    <p>
                        <strong>Address:</strong><br>
                        ${user.address.street}, ${user.address.city}, ${user.address.state} ${user.address.zipCode}
                    </p>
                    <p>
                        <strong>Preferences:</strong><br>
                        Theme: ${user.preferences.theme}<br>
                        Language: ${user.preferences.language}<br>
                        Notifications: ${user.preferences.notifications}<br>
                        Newsletter Subscribe: ${user.preferences.subscription}
                    </p>
                `;
                container.appendChild(card);
            })
        })
        .catch(err => console.error('Fetch error: ' + err.message));
    </script>
</body>
</html>
